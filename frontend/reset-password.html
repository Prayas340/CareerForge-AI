<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CareerForge AI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00685f",
            "surface-tint": "#006a61",
            "on-primary": "#ffffff",
            "error": "#ba1a1a",
            "on-surface": "#111c2d",
            "on-surface-variant": "#3d4947",
            "surface-container": "#f0f3ff",
            "surface-container-high": "#dee8ff",
            "surface-container-lowest": "#ffffff",
            "outline-variant": "#d8e3fb"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-[#121212] text-slate-800 dark:text-[#f8fafc] min-h-screen flex flex-col items-center justify-center p-4 font-sans antialiased">

  <!-- Ambient Backdrop Glow -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
    <div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-[#00685f]/15 rounded-full blur-[100px]"></div>
    <div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] bg-emerald-500/10 rounded-full blur-[100px]"></div>
  </div>

  <!-- Reset Password Card Container -->
  <div class="w-full max-w-md bg-white dark:bg-[#1e1e1e] rounded-3xl shadow-2xl border border-slate-200 dark:border-[#334155] p-8 relative overflow-hidden backdrop-blur-xl animate-[popIn_0.3s_cubic-bezier(0.16,1,0.3,1)]">
    
    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-primary/10 dark:bg-primary/20 text-primary flex items-center justify-center mb-3 shadow-inner">
        <span class="material-symbols-outlined text-[32px]">lock_reset</span>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 dark:text-[#f8fafc] tracking-tight">Set New Password</h2>
      <p class="text-xs text-slate-500 dark:text-[#94a3b8] mt-1" id="page-subtitle">Choose a secure, strong password for your account.</p>
    </div>

    <!-- Active Form View -->
    <form id="reset-password-form" onsubmit="handlePasswordResetSubmit(event)" class="flex flex-col gap-4">
      
      <!-- New Password -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-[#f8fafc] mb-1.5">New Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="new-password" 
            required 
            minlength="8" 
            placeholder="At least 8 characters"
            oninput="checkPasswordStrength()"
            class="w-full text-sm bg-slate-100 dark:bg-[#2a2a2a] text-slate-900 dark:text-[#f8fafc] border border-slate-300 dark:border-[#334155] rounded-xl px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-primary transition-all pr-10" 
          />
          <button type="button" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" onclick="togglePasswordVisibility('new-password', this)">
            <span class="material-symbols-outlined text-[18px]">visibility</span>
          </button>
        </div>
      </div>

      <!-- Password Strength Meter -->
      <div class="flex flex-col gap-1">
        <div class="h-1.5 w-full bg-slate-200 dark:bg-[#334155] rounded-full overflow-hidden flex">
          <div id="strength-bar" class="h-full bg-red-500 w-0 transition-all duration-300"></div>
        </div>
        <div class="flex justify-between items-center text-[11px] text-slate-500 dark:text-[#94a3b8]">
          <span>Strength: <strong id="strength-label">None</strong></span>
          <span>Min. 8 characters</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-[#f8fafc] mb-1.5">Confirm Password</label>
        <div class="relative">
          <input 
            type="password" 
            id="confirm-password" 
            required 
            minlength="8" 
            placeholder="Repeat new password"
            class="w-full text-sm bg-slate-100 dark:bg-[#2a2a2a] text-slate-900 dark:text-[#f8fafc] border border-slate-300 dark:border-[#334155] rounded-xl px-3.5 py-2.5 outline-none focus:ring-2 focus:ring-primary transition-all pr-10" 
          />
          <button type="button" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" onclick="togglePasswordVisibility('confirm-password', this)">
            <span class="material-symbols-outlined text-[18px]">visibility</span>
          </button>
        </div>
      </div>

      <!-- Error / Status Notice -->
      <div id="reset-error" class="text-xs text-red-600 dark:text-red-400 font-medium min-h-[16px]"></div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submit-reset-btn" 
        class="w-full py-3 rounded-xl bg-primary text-white font-bold text-sm hover:bg-surface-tint transition-all shadow-md shadow-primary/20 hover:-translate-y-0.5 active:translate-y-0"
      >
        Update Password
      </button>

      <!-- Back to App -->
      <a href="/" class="text-xs text-center text-primary font-semibold hover:underline mt-2">
        Return to CareerForge AI
      </a>
    </form>

    <!-- Success View (Hidden Initially) -->
    <div id="reset-success-view" class="hidden flex-col items-center text-center gap-4 py-4 animate-[fadeIn_0.4s_ease-out]">
      <div class="w-16 h-16 rounded-full bg-emerald-500/10 text-emerald-600 flex items-center justify-center shadow-inner">
        <span class="material-symbols-outlined text-[36px]">verified</span>
      </div>
      <div>
        <h3 class="text-xl font-bold text-slate-900 dark:text-[#f8fafc]">Password Updated!</h3>
        <p class="text-xs text-slate-500 dark:text-[#94a3b8] mt-1 max-w-xs">Your password has been changed successfully. You can now sign in with your new credentials.</p>
      </div>
      <a href="/" class="w-full py-3 rounded-xl bg-primary text-white font-bold text-sm text-center hover:bg-surface-tint transition-all shadow-md shadow-primary/20">
        Go to Dashboard
      </a>
    </div>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-8 right-8 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Scripts -->
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/authService.js"></script>

  <script>
    function checkPasswordStrength() {
      const pwd = document.getElementById("new-password")?.value || "";
      const bar = document.getElementById("strength-bar");
      const label = document.getElementById("strength-label");
      
      let score = 0;
      if (pwd.length >= 8) score++;
      if (/[A-Z]/.test(pwd)) score++;
      if (/[0-9]/.test(pwd)) score++;
      if (/[^A-Za-z0-9]/.test(pwd)) score++;

      if (score === 0) {
        bar.style.width = "0%";
        bar.className = "h-full bg-red-500 transition-all duration-300";
        label.innerText = "None";
      } else if (score <= 2) {
        bar.style.width = "40%";
        bar.className = "h-full bg-red-500 transition-all duration-300";
        label.innerText = "Weak";
      } else if (score === 3) {
        bar.style.width = "75%";
        bar.className = "h-full bg-amber-500 transition-all duration-300";
        label.innerText = "Moderate";
      } else {
        bar.style.width = "100%";
        bar.className = "h-full bg-emerald-500 transition-all duration-300";
        label.innerText = "Strong";
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector(".material-symbols-outlined");
      if (input.type === "password") {
        input.type = "text";
        icon.innerText = "visibility_off";
      } else {
        input.type = "password";
        icon.innerText = "visibility";
      }
    }

    async function handlePasswordResetSubmit(e) {
      e.preventDefault();
      const newPwd = document.getElementById("new-password")?.value;
      const confirmPwd = document.getElementById("confirm-password")?.value;
      const errElem = document.getElementById("reset-error");
      const btn = document.getElementById("submit-reset-btn");

      if (errElem) errElem.innerText = "";

      if (newPwd !== confirmPwd) {
        if (errElem) errElem.innerText = "Passwords do not match. Please verify.";
        return;
      }

      if (newPwd.length < 8) {
        if (errElem) errElem.innerText = "Password must be at least 8 characters long.";
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerText = "Updating...";
      }

      try {
        const res = await window.AuthService.handleUpdatePassword(newPwd);
        if (!res.success) {
          if (errElem) errElem.innerText = res.error || "Failed to update password. Session may have expired.";
          return;
        }

        // Show Success View
        document.getElementById("reset-password-form").classList.add("hidden");
        document.getElementById("page-subtitle").classList.add("hidden");
        document.getElementById("reset-success-view").classList.remove("hidden");
        document.getElementById("reset-success-view").classList.add("flex");
      } catch (err) {
        if (errElem) errElem.innerText = err.message || "An unexpected error occurred.";
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerText = "Update Password";
        }
      }
    }
  </script>
</body>
</html>
